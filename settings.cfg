; Project settings, read by the Python front-end (Source/Python/pythonScripts/yapt/settings.py).
; To override entries on this machine only, put them in settings_local.cfg (gitignored) next to this file,
; using the same [section] / key layout. Relative paths are resolved against this file's folder (the repo root).

[paths]
; root folder for models / textures, relative asset paths in scripts are resolved against it
asset_path = ../YAPTAssets
